name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A conflict marker anywhere in the tracked tree fails the job, naming the file and line
      # (#45 [G34]). The gap it closes is the Prettier-ignored paths — the authored scope doc,
      # the recorded and golden fixtures, the lockfile — where a merge pushed with a hunk
      # unresolved passes every other gate (#112's merge, in docs/mvp-scope.md); elsewhere
      # Prettier already fails on a marker and typecheck fails on one in a .ts file. First, before
      # the install, so it always runs and its named lines print even when lint would also fail.
      # `=======` alone is not matched: a conflict always carries the other two, and a bare
      # `=======` line is a legal Markdown heading underline. `git grep` exits 1 on no match and
      # above 1 on an error, so only exactly 1 passes — a failed scan is red, not silently green.
      # Rides in the lint job, so the required-checks list in branch protection is unchanged.
      - name: no conflict markers
        run: |
          git grep -nE "^(<<<<<<<|>>>>>>>|\|\|\|\|\|\|\|)( |$)" -- . && exit 1
          [ $? -eq 1 ]
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Formatting rides in the lint job rather than a job of its own, so this needs no change
      # to the required-checks list in branch protection.
      - run: npm run format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The bench's tests run in the `bench` job below, not here (#120). That file is the one in
      # the suite whose cost scales with the recording count and the seed count — ~65 s of this
      # job's vitest run on the runner at #117's merge — so the four existing gates keep their old
      # wall time and the bench's minute is its own job's. `--exclude` adds to the config's
      # exclude list; the include list in vite.config.ts is unchanged, so a local `npm run test`
      # still runs everything.
      - run: npm run test -- --exclude scripts/bench.test.ts

  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The bench's tests alone — the seeds, the folds, the rank pin, the override, and the
      # baseline byte for byte — in the [19] shape: the check is a vitest test, not a `git diff`
      # of the baseline. A new job is a new check, not in branch protection's required list until
      # the owner adds it; until then it rides unrequired.
      - run: npm run test -- scripts/bench.test.ts
