name: Claude Code Review

on:
  # The reviewer is not the merge authority — the owner is — so it runs once when a pull request
  # arrives and re-runs only when asked. `synchronize` put a full review on every push, which is
  # how #33 reached ten rounds and #47 seven, with no stop before owner closure (#50). Re-runs come
  # from claude.yml, on an `@claude` mention. The CI gates in ci.yml still run on every push: the
  # gates are per-push, the review is not.
  pull_request:
    types: [opened, reopened, ready_for_review]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # Full history, not one commit: the reviewer is allow-listed for `git log`, `git blame`,
      # `git diff`, and `git show`, and at depth 1 the workspace has a single parentless commit —
      # log returns one entry, blame attributes every line to it, and show against an earlier ref
      # fails. The tools were granted and inert (#70). The diff itself was never at risk; it comes
      # from `gh pr diff` over the API. What was missing is the history this repo's review rounds
      # argue from — which PR introduced a line, and what its round said.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gates are installed here rather than left to the reviewer. With no `node_modules`
      # in the workspace, whether lint, typecheck, and test ran came down to whether the agent
      # chose to install and whether the command it chose matched the allow-list letter for
      # letter — which is why #63's rounds reported an absent `node_modules` and denied
      # dependency installation while #65's on-open run ran all four (#67). Same versions as
      # ci.yml, so the reviewer sees what the gates see.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The plugin stays silent when nothing clears its confidence bar, and stops before its
          # posting step when its eligibility check decides a PR does not need review (#24). Silence
          # is what hid a misconfigured workflow for four PRs (#17), so the receipt rule comes first
          # and covers the early exit: every run ends with exactly one comment.
          prompt: |
            Before anything else, the rule for this run: it must end with exactly one comment on the
            pull request, posted with gh pr comment. If the review below produces findings, that
            comment carries them. If the review exits early for any reason — including its
            eligibility check deciding the pull request does not need review — still post exactly one
            line in this shape: "Code review: not eligible for review — docs only." (state the actual
            reason after the dash). If the review runs and nothing clears the confidence bar, post
            exactly: "Code review: reviewed, nothing above the confidence bar."

            The dependencies are already installed in the workspace, so run the four gates before
            reviewing — npm run lint, npm run typecheck, npm run test, npm run format:check — and
            open that one comment with a line saying whether they ran and what they returned:
            "Checks: lint, typecheck, test, format:check all pass." or, naming the failure or the
            reason, "Checks: test fails — 3 failing." / "Checks: not run — <reason>." A silent
            receipt is what hid four PRs' worth of misconfiguration (#17); a receipt that does not
            say whether the checks ran hides the next one. The checks are context for the review,
            not a verdict on it — CI is the gate.

            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment
          # The code-review plugin runs subagents, reads the PR with gh, walks git history, and posts
          # its result with gh pr comment. Granting only the inline-comment tool let every run since #8
          # finish green having been denied all of that and posted nothing (see issue #17).
          # Opus 5: the reviewer is the one check that did not write the code, so it is the strongest
          # model that is not the author, and deliberately dissimilar from the engineer on Fable.
          claude_args: '--model claude-opus-5 --allowedTools "Agent,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),Bash(git diff:*),Bash(git show:*),Bash(npm ci:*),Bash(npm run lint:*),Bash(npm run typecheck:*),Bash(npm run test:*),Bash(npm run format:check:*),mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action writes the full transcript — every tool call, result, and permission denial — to
      # RUNNER_TEMP and uploads nothing, so a silent or denied run cannot be read (#24). The artifact
      # is public, like the repo: it holds what the reviewer saw and said on a public PR, produced
      # by the allow-listed tools above, none of which can print the workflow's tokens.
      - name: Upload the review transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-transcript-pr${{ github.event.pull_request.number }}-run${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 3
